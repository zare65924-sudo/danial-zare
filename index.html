<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Danial Zare — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d;--panel:rgba(8,12,22,.82);--line:rgba(255,255,255,.13);
  --white:#f8faff;--muted:#aab7c8;--silver:#d8e8f5;--accent:#20d9d0;
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;padding:34px 17px;display:grid;place-items:center;
  color:var(--white);font-family:"Vazirmatn",Tahoma,sans-serif;overflow-x:hidden;
  background:#000;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;
  background-image:none;
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse at center,#000 10%,transparent 78%);
}
.ambient{display:none}
.orb{position:absolute;border:1px solid rgba(185,160,255,.20);border-radius:50%;animation:drift 16s ease-in-out infinite}
.orb.one{width:360px;height:360px;top:-180px;left:-120px;box-shadow:0 0 100px rgba(0,190,255,.13)}
.orb.two{width:240px;height:240px;right:-130px;bottom:-100px;animation-delay:-6s;box-shadow:0 0 90px rgba(255,83,157,.13)}
@keyframes drift{50%{transform:translate(18px,-13px) scale(1.04)}}
.shell{width:min(100%,490px);position:relative;z-index:1}
.topline{display:flex;align-items:center;justify-content:space-between;margin:0 8px 13px;color:#a8a8a8}
.topline span{font:600 9px "Orbitron",sans-serif;letter-spacing:2.4px;direction:ltr}
.topline b{font:500 10px "Vazirmatn",sans-serif;letter-spacing:.4px}
.card{
  position:relative;overflow:hidden;padding:36px 30px 27px;border-radius:29px;
  background:#080808;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 35px 100px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
}
.card:before{
  content:"";position:absolute;inset:0 12% auto;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)
}
.card:after{
  content:"";position:absolute;width:260px;height:260px;left:-145px;top:-155px;
  border-radius:50%;background:rgba(255,255,255,.025);filter:blur(70px);pointer-events:none
}
.header{position:relative;text-align:center;padding-bottom:25px}
.monogram{
  width:76px;height:76px;margin:0 auto 19px;border-radius:24px;
  display:grid;place-items:center;position:relative;
  border:1px solid rgba(220,205,255,.45);
  background:linear-gradient(135deg,#12b8e8 0%,#7562f6 48%,#e65ca8 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 12px 35px rgba(82,72,220,.30);
  color:#fff;font:700 22px "Orbitron",sans-serif;direction:ltr;
}
.monogram:before,.monogram:after{content:"";position:absolute;border:1px solid rgba(104,218,255,.30);border-radius:29px;inset:-7px}
.monogram:after{inset:-13px;border-color:rgba(222,123,255,.20)}
.eyebrow{font-size:10px;letter-spacing:3px;color:#bdbdbd;direction:ltr;margin-bottom:8px}
h1{
  margin:0;color:#f4f4f6;font-size:clamp(31px,8vw,39px);line-height:1.35;
  font-weight:800;letter-spacing:-.8px
}
.subtitle{margin:10px 0 0;color:#bdbdbd;font-size:12px;line-height:2}
.divider{display:flex;align-items:center;gap:12px;margin:0 0 20px;color:#aaa;font-size:9px;letter-spacing:2px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(124,211,255,.45),rgba(206,131,255,.4))}
.divider:after{transform:rotate(180deg)}
.links{display:grid;gap:11px}
.contact{
  min-height:66px;display:flex;align-items:center;gap:14px;padding:10px 13px;
  color:var(--white);text-decoration:none;border-radius:17px;
  border:1px solid rgba(255,255,255,.13);
  background:#101010;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.075),0 8px 20px rgba(0,0,0,.18);
  transition:transform .22s,border-color .22s,background .22s,box-shadow .22s;
}
.contact:hover{transform:translateY(-3px);border-color:rgba(126,211,255,.55);background:#181818;box-shadow:0 13px 30px rgba(0,0,0,.30),0 0 22px rgba(126,105,226,.12)}
.iconbox{
  width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:13px;
  color:#fff;background:#202020;
  border:1px solid rgba(255,255,255,.14)
}
.iconbox svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbox.telegram svg{fill:currentColor;stroke:none}
.iconbox.telegram{background:#229ED9;border-color:#48b9ee;color:#fff;box-shadow:0 5px 18px rgba(34,158,217,.28)}
.iconbox.instagram{color:#fff;background:linear-gradient(135deg,#833ab4 0%,#c13584 38%,#fd1d1d 68%,#fcb045 100%);border-color:rgba(255,255,255,.25);box-shadow:0 5px 18px rgba(225,48,108,.22)}
.iconbox.bale{color:#fff;background:linear-gradient(145deg,#1597e5,#0874c5);border-color:rgba(120,210,255,.38);box-shadow:0 5px 18px rgba(0,145,220,.23)}
.contact:last-child .iconbox{color:#fff;background:linear-gradient(145deg,#16b98b,#168baf);border-color:rgba(104,245,206,.30);box-shadow:0 5px 18px rgba(22,185,139,.20)}
.details{display:flex;flex:1;min-width:0;flex-direction:column;gap:2px;text-align:right}
.label{font-size:13px;font-weight:700;color:#fbfaff}
.handle{font:500 9px "Orbitron",sans-serif;letter-spacing:.55px;color:#b2bdcb;direction:ltr;text-align:right;overflow-wrap:anywhere}
.vpn-note{font-size:8px;font-weight:400;line-height:1.5;color:rgba(190,207,220,.68);letter-spacing:0; margin-top:1px}
.arrow{color:#aaa;font:16px "Orbitron",sans-serif;direction:ltr}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid rgba(190,178,255,.16);color:#999;font-size:9px}
.footer .brand{font:600 9px "Orbitron",sans-serif;letter-spacing:1.5px;direction:ltr}
.footer .status{display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:50%;background:#38ddb0;box-shadow:0 0 10px #38ddb0}
@media(max-width:390px){.card{padding:31px 19px 23px}.contact{min-height:62px}.monogram{width:68px;height:68px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Red 3D treatment — pure black base with dimensional crimson highlights */
body{background:#030303;isolation:isolate}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 12% 18%,rgba(150,12,32,.28),transparent 42%),
    radial-gradient(ellipse at 88% 32%,rgba(105,0,18,.22),transparent 40%),
    radial-gradient(ellipse at 52% 100%,rgba(135,0,24,.25),transparent 48%),
    linear-gradient(135deg,#030303 0%,#090304 48%,#030303 100%)}
.orb.one,.orb.two{border-color:rgba(255,45,65,.24);box-shadow:0 0 95px rgba(210,0,28,.16)}
.card{background:linear-gradient(145deg,#151012 0%,#080808 42%,#100608 100%);border:1px solid rgba(255,65,82,.34);box-shadow:0 38px 90px rgba(0,0,0,.9),0 0 0 1px rgba(130,0,18,.22),0 18px 48px rgba(115,0,18,.20),inset 0 2px 0 rgba(255,255,255,.10),inset 0 -12px 25px rgba(0,0,0,.55)}
.card:before{height:2px;background:linear-gradient(90deg,transparent,rgba(255,75,92,.85),rgba(255,190,190,.25),transparent);box-shadow:0 0 16px rgba(255,20,48,.28)}
.card:after{background:rgba(210,0,35,.10);filter:blur(75px)}
.monogram{border:1px solid rgba(255,145,155,.75);background:linear-gradient(145deg,#ff5969 0%,#c90025 38%,#610012 100%);box-shadow:inset 0 3px 5px rgba(255,255,255,.36),inset 0 -8px 13px rgba(45,0,7,.48),0 9px 0 #47000d,0 14px 24px rgba(190,0,32,.42),0 0 36px rgba(255,0,45,.22);text-shadow:0 2px 3px rgba(50,0,0,.55);transform:translateY(-2px)}
.monogram:before,.monogram:after{border-color:rgba(255,75,95,.40);box-shadow:0 0 17px rgba(255,0,45,.13)}
.eyebrow{color:#ff6878}
.divider{color:#ff8490}
.divider:before,.divider:after{background:linear-gradient(90deg,transparent,rgba(255,45,70,.78),rgba(255,145,155,.25))}
.contact{background:linear-gradient(145deg,#1b1416 0%,#0b090a 58%,#16090c 100%);border:1px solid rgba(255,75,92,.23);box-shadow:inset 0 2px 0 rgba(255,255,255,.09),inset 0 -5px 10px rgba(0,0,0,.6),0 7px 0 #31000a,0 11px 18px rgba(0,0,0,.58);transform:translateY(-2px)}
.contact:hover{transform:translateY(-5px);border-color:rgba(255,85,105,.72);background:linear-gradient(145deg,#281317,#10090b 60%,#260910);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 9px 0 #43000e,0 17px 28px rgba(0,0,0,.65),0 0 25px rgba(220,0,38,.20)}
.iconbox{background:linear-gradient(145deg,#302024,#110b0d);border-color:rgba(255,100,115,.34);box-shadow:inset 0 2px 3px rgba(255,255,255,.13),inset 0 -4px 7px rgba(0,0,0,.5),0 4px 0 #3a0710,0 7px 11px rgba(0,0,0,.45)}
.iconbox.telegram{box-shadow:inset 0 2px 3px rgba(255,255,255,.35),0 4px 0 #075477,0 7px 13px rgba(0,0,0,.48)}
.iconbox.instagram{box-shadow:inset 0 2px 3px rgba(255,255,255,.34),0 4px 0 #59133d,0 7px 13px rgba(0,0,0,.48)}
.iconbox.bale{box-shadow:inset 0 2px 3px rgba(255,255,255,.30),0 4px 0 #064879,0 7px 13px rgba(0,0,0,.48)}
.contact:last-child .iconbox{background:linear-gradient(145deg,#ff5365,#9c001c);border-color:rgba(255,140,150,.55);box-shadow:inset 0 2px 3px rgba(255,255,255,.35),0 4px 0 #4c0010,0 7px 13px rgba(0,0,0,.48)}
.label{ text-shadow:0 1px 0 #000 }
.arrow{color:#ff6878;text-shadow:0 0 10px rgba(255,0,45,.42)}
.footer{border-top-color:rgba(255,65,85,.25)}
.dot{background:#ff344f;box-shadow:0 0 10px #ff344f}
@media(prefers-reduced-motion:reduce){.contact{transform:none}}


/* Fresh youthful midnight / electric palette */
:root{
 --bg:#070a14;--panel:rgba(13,18,34,.78);--line:rgba(151,177,255,.18);
 --white:#f5f7ff;--muted:#aeb8d2;--silver:#dce7ff;--accent:#55e6ff;
}
body{background:#070a14;color:var(--white);isolation:isolate}
body:before{opacity:.16;background-image:linear-gradient(rgba(120,155,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(120,155,255,.10) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse at center,#000 5%,transparent 78%)}
body:after{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 12% 18%,rgba(0,190,255,.22),transparent 34%),radial-gradient(ellipse at 88% 22%,rgba(119,74,255,.22),transparent 36%),radial-gradient(ellipse at 52% 100%,rgba(0,220,190,.13),transparent 38%),linear-gradient(145deg,#070a14 0%,#0a1020 52%,#080a16 100%);animation:aurora 16s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(1.5%, -1%,0) scale(1.04);filter:hue-rotate(16deg)}}
.ambient{display:block;position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.orb{border-color:rgba(90,205,255,.18)}
.orb.one{box-shadow:0 0 110px rgba(0,190,255,.16)}
.orb.two{border-color:rgba(160,110,255,.2);box-shadow:0 0 100px rgba(120,75,255,.17)}
.topline{color:#9eabc9}.topline b{color:#aeb8d2}
.card{background:linear-gradient(145deg,rgba(19,27,49,.88),rgba(8,12,25,.91) 55%,rgba(16,14,36,.88));border:1px solid rgba(133,175,255,.25);box-shadow:0 36px 100px rgba(0,0,0,.68),0 0 45px rgba(40,130,255,.09),inset 0 1px 0 rgba(255,255,255,.13);backdrop-filter:blur(26px)}
.card:before{background:linear-gradient(90deg,transparent,rgba(100,225,255,.58),rgba(172,130,255,.5),transparent);height:1px}
.card:after{background:rgba(40,160,255,.09)}
.monogram{border:1px solid rgba(180,235,255,.6);background:linear-gradient(140deg,#64efff 0%,#318bff 43%,#8259ff 100%);box-shadow:inset 0 2px 5px rgba(255,255,255,.42),inset 0 -8px 13px rgba(20,35,110,.35),0 8px 0 #18366f,0 14px 28px rgba(30,130,255,.30),0 0 36px rgba(65,190,255,.18);text-shadow:0 2px 4px rgba(12,25,70,.45)}
.monogram:before,.monogram:after{border-color:rgba(100,220,255,.32);box-shadow:0 0 20px rgba(65,180,255,.12)}
.eyebrow{color:#75eaff}
h1{color:#f4f7ff;text-shadow:0 0 28px rgba(85,180,255,.12)}
.subtitle{color:#b5c0d8}
.divider{color:#b5c9ef}.divider:before,.divider:after{background:linear-gradient(90deg,transparent,rgba(67,215,255,.72),rgba(150,115,255,.55))}
.contact{background:linear-gradient(135deg,rgba(27,39,66,.83),rgba(12,18,34,.88) 60%,rgba(25,20,51,.83));border:1px solid rgba(132,175,255,.21);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -5px 12px rgba(0,0,0,.26),0 7px 0 #101b35,0 12px 24px rgba(0,0,0,.38);transform:translateY(-1px)}
.contact:hover{transform:translateY(-4px);border-color:rgba(87,221,255,.62);background:linear-gradient(135deg,rgba(29,57,87,.94),rgba(15,24,48,.95) 60%,rgba(42,29,77,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 9px 0 #12284b,0 18px 30px rgba(0,0,0,.48),0 0 26px rgba(48,180,255,.16)}
.iconbox{background:linear-gradient(145deg,#263653,#121c32);border-color:rgba(155,196,255,.27);box-shadow:inset 0 2px 3px rgba(255,255,255,.14),inset 0 -4px 7px rgba(0,0,0,.38),0 4px 0 #152440,0 7px 11px rgba(0,0,0,.35)}
.iconbox.telegram{box-shadow:inset 0 2px 3px rgba(255,255,255,.35),0 4px 0 #075477,0 7px 13px rgba(0,0,0,.38)}
.iconbox.instagram{box-shadow:inset 0 2px 3px rgba(255,255,255,.34),0 4px 0 #59133d,0 7px 13px rgba(0,0,0,.38)}
.iconbox.bale{box-shadow:inset 0 2px 3px rgba(255,255,255,.30),0 4px 0 #064879,0 7px 13px rgba(0,0,0,.38)}
.label{color:#f5f7ff;text-shadow:none}.handle{color:#b9c8e4}.vpn-note{color:rgba(180,210,232,.72)}
.arrow{color:#66eaff;text-shadow:0 0 12px rgba(50,205,255,.42)}
.footer{border-top-color:rgba(112,165,255,.20);color:#9eabc9}.footer .brand{color:#b7d8ff}.dot{background:#57e7c5;box-shadow:0 0 10px #57e7c5}
@media(prefers-reduced-motion:reduce){body:after{animation:none}}


/* Button motion: soft entrance, lift, glow and press feedback */
@keyframes buttonEnter{
  from{opacity:0;transform:translateY(16px) scale(.975);filter:blur(3px)}
  to{opacity:1;transform:translateY(-1px) scale(1);filter:blur(0)}
}
@keyframes softGlow{
  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -5px 12px rgba(0,0,0,.26),0 7px 0 #101b35,0 12px 24px rgba(0,0,0,.38)}
  50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -5px 12px rgba(0,0,0,.26),0 7px 0 #101b35,0 12px 27px rgba(0,0,0,.4),0 0 15px rgba(76,190,255,.09)}
}
.links .contact{
  opacity:0;
  animation:buttonEnter .65s cubic-bezier(.2,.8,.2,1) forwards,softGlow 4.8s ease-in-out 1s infinite;
  will-change:transform,opacity;
}
.links .contact:nth-child(1){animation-delay:.12s,.9s}
.links .contact:nth-child(2){animation-delay:.24s,1.1s}
.links .contact:nth-child(3){animation-delay:.36s,1.3s}
.links .contact:nth-child(4){animation-delay:.48s,1.5s}
.links .contact:hover{
  animation-play-state:paused;
  transform:translateY(-6px) scale(1.015);
  transition:transform .24s cubic-bezier(.2,.8,.2,1),border-color .24s,background .24s,box-shadow .24s;
}
.links .contact:active{
  transform:translateY(2px) scale(.985);
  transition:transform .09s ease;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 2px 0 #101b35,0 5px 12px rgba(0,0,0,.35);
}
.contact .iconbox{transition:transform .28s cubic-bezier(.2,.8,.2,1),filter .28s}
.contact:hover .iconbox{transform:rotate(-7deg) scale(1.09);filter:brightness(1.12)}
.contact .arrow{display:inline-block;transition:transform .25s ease,color .25s}
.contact:hover .arrow{transform:translate(-3px,-2px);color:#fff}
@media(prefers-reduced-motion:reduce){
 .links .contact{opacity:1;animation:none;will-change:auto}
 .links .contact:hover,.links .contact:active{transform:none}
 .contact .iconbox,.contact .arrow{transition:none}
}



/* Full-page cinematic motion layer */
body{background:#050814;}
body:after{
  background:
    radial-gradient(ellipse at 14% 22%,rgba(0,195,255,.27),transparent 34%),
    radial-gradient(ellipse at 86% 20%,rgba(132,76,255,.25),transparent 36%),
    radial-gradient(ellipse at 55% 92%,rgba(0,225,190,.17),transparent 38%),
    linear-gradient(125deg,#050814 0%,#0a1024 48%,#080817 100%);
  background-size:140% 140%;
  animation:cinemaAurora 18s ease-in-out infinite alternate;
}
@keyframes cinemaAurora{
  0%{background-position:0% 20%;filter:hue-rotate(0deg) brightness(.9)}
  50%{background-position:70% 80%;filter:hue-rotate(18deg) brightness(1.12)}
  100%{background-position:100% 10%;filter:hue-rotate(-12deg) brightness(1)}
}
.ambient{z-index:0;}
.ambient:before,.ambient:after{
  content:"";position:absolute;inset:-30%;pointer-events:none;
  background:conic-gradient(from 0deg at 50% 50%,transparent 0 18%,rgba(75,210,255,.07) 22%,transparent 29% 55%,rgba(160,105,255,.08) 61%,transparent 69% 100%);
  filter:blur(35px);animation:lightOrbit 28s linear infinite;
}
.ambient:after{animation-duration:38s;animation-direction:reverse;transform:scale(.8);opacity:.7}
@keyframes lightOrbit{to{transform:rotate(360deg) scale(1.05)}}
.shell{animation:pageArrive 1.05s cubic-bezier(.18,.78,.22,1) both;}
@keyframes pageArrive{from{opacity:0;transform:translateY(28px) scale(.965);filter:blur(9px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.card{animation:cardFloat 7s ease-in-out 1.1s infinite;transform-style:preserve-3d;}
@keyframes cardFloat{0%,100%{translate:0 0}50%{translate:0 -5px}}
.card:before{animation:topGlint 5.5s ease-in-out infinite;}
@keyframes topGlint{0%,100%{opacity:.45;filter:brightness(.8)}50%{opacity:1;filter:brightness(1.8)}}
.monogram{animation:logoPulse 4.2s ease-in-out infinite;}
@keyframes logoPulse{0%,100%{filter:saturate(1);box-shadow:inset 0 2px 5px rgba(255,255,255,.42),inset 0 -8px 13px rgba(20,35,110,.35),0 8px 0 #18366f,0 14px 28px rgba(30,130,255,.30),0 0 26px rgba(65,190,255,.13)}50%{filter:saturate(1.3) brightness(1.12);box-shadow:inset 0 2px 5px rgba(255,255,255,.5),inset 0 -8px 13px rgba(20,35,110,.35),0 8px 0 #18366f,0 14px 32px rgba(30,130,255,.4),0 0 46px rgba(65,190,255,.3)}}
/* A traveling light beam makes the entire page feel alive */
.page-sweep{position:fixed;inset:-60% -35%;z-index:2;pointer-events:none;opacity:0;
  background:linear-gradient(112deg,transparent 43%,rgba(255,255,255,.025) 47%,rgba(115,225,255,.10) 49%,rgba(255,255,255,.035) 51%,transparent 55%);
  transform:translateX(-65%) rotate(0deg);animation:screenSweep 11s ease-in-out 2s infinite;}
@keyframes screenSweep{0%,55%{transform:translateX(-65%);opacity:0}64%{opacity:1}82%{transform:translateX(65%);opacity:.8}100%{transform:translateX(65%);opacity:0}}
/* Fine animated stars / dust */
.dust{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:#a8edff;opacity:0;box-shadow:0 0 10px 2px rgba(85,210,255,.55);animation:floatDust var(--dur,9s) linear infinite;}
@keyframes floatDust{0%{transform:translate3d(0,12vh,0) scale(.5);opacity:0}15%{opacity:.7}80%{opacity:.45}100%{transform:translate3d(var(--drift,35px),-110vh,0) scale(1.25);opacity:0}}
@media(max-width:600px){.card{animation:cardFloat 8s ease-in-out 1.1s infinite}.page-sweep{opacity:0;animation-duration:15s}.dust i{width:2px;height:2px}}
@media(prefers-reduced-motion:reduce){body:after,.ambient:before,.ambient:after,.shell,.card,.card:before,.monogram,.page-sweep,.dust i{animation:none!important;translate:none!important;filter:none!important}}

</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><div class="orb one"></div><div class="orb two"></div></div>
<div class="dust" aria-hidden="true"></div><div class="page-sweep" aria-hidden="true"></div>
<div class="shell">
  <div class="topline"><span>PERSONAL ACCESS</span><b>صفحه ارتباط شخصی</b></div>
  <main class="card">
    <header class="header">
      <div class="monogram">DZ</div>

<script>
(() => {
  const dust = document.querySelector('.dust');
  if (dust && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    for (let i = 0; i < 24; i++) {
      const particle = document.createElement('i');
      particle.style.left = (Math.random() * 100) + '%';
      particle.style.top = (Math.random() * 100) + '%';
      particle.style.setProperty('--dur', (7 + Math.random() * 11) + 's');
      particle.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
      particle.style.animationDelay = (-Math.random() * 18) + 's';
      dust.appendChild(particle);
    }
  }
  const card = document.querySelector('.card');
  const finePointer = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if (card && finePointer && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    card.addEventListener('pointermove', (event) => {
      const r = card.getBoundingClientRect();
      const x = (event.clientX - r.left) / r.width - .5;
      const y = (event.clientY - r.top) / r.height - .5;
      card.style.transform = `perspective(1000px) rotateY(${x * 3}deg) rotateX(${-y * 3}deg) translateY(-2px)`;
    });
    card.addEventListener('pointerleave', () => { card.style.transform = ''; });
  }
})();
</script>
